<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PREPFIX Timetables</title>
<meta name="description" content="Teachers, classes, labs and master timetables — always the latest version.">

<meta property="og:title" content="PREPFIX Timetables - install the app">
<meta property="og:description" content="Open the link, tap INSTALL. Your school timetable on your phone: updates itself, works offline.">
<style>#brandsplash{position:fixed;inset:0;z-index:9999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s ease}#brandsplash .alogo{width:min(78vw,520px)}#brandsplash p{margin:0;font:600 13px/1.4 Poppins,"Segoe UI",Arial,sans-serif;letter-spacing:.18em;color:#12284C;text-transform:uppercase}#brandsplash small{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font:600 11px/1 Poppins,"Segoe UI",Arial,sans-serif;letter-spacing:.12em;color:#667085}#brandsplash i{width:42px;height:4px;border-radius:4px;background:linear-gradient(90deg,#0B4FE0,#19B5F5,#F7941D);animation:bsp 1.2s ease-in-out 3}@keyframes bsp{0%,100%{transform:scaleX(.3)}50%{transform:scaleX(1)}}#brandsplash.out{opacity:0;pointer-events:none}
#brandsplash .alogo.sp{overflow:visible}
#brandsplash .pmw{position:absolute;inset:0;transform-origin:14.5% 40%;animation:pmpop .95s cubic-bezier(.2,.9,.25,1.25) both,pmglow 1.7s ease-in-out .95s 1}
#brandsplash .pm{clip-path:polygon(0 0,28% 0,28% 70.2%,18.3% 70.2%,18.3% 100%,0 100%)}
#brandsplash .wm{clip-path:inset(0 0 29.8% 28%);opacity:0;animation:wmin .75s ease-out .5s both}
#brandsplash .w1{animation-delay:1.05s}#brandsplash .alogo .w2{animation-delay:1.4s}#brandsplash .alogo .w3{animation-delay:1.75s}#brandsplash .alogo .w1{animation-delay:1.05s}
#brandsplash .rg{position:absolute;left:14.5%;top:40%;width:24%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(25,181,245,.65);opacity:0;transform:translate(-50%,-50%) scale(.4);animation:rgx 1.7s ease-out 1;animation-delay:.7s}
#brandsplash .rg.r2{animation-delay:1.55s;border-color:rgba(247,148,29,.6)}

#brandsplash .gl{position:absolute;left:14.5%;top:40%;width:38%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(25,181,245,.38),rgba(25,181,245,0) 66%);transform:translate(-50%,-50%);opacity:0;animation:glp 1.7s ease-in-out .9s 1}
@keyframes glp{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pmpop{0%{opacity:0;transform:scale(.2) rotate(-200deg)}55%{opacity:1}100%{opacity:1;transform:none}}
@keyframes pmglow{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes wmin{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes rgx{0%{opacity:.85;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.8)}}
@media (prefers-reduced-motion:reduce){#brandsplash .pmw{animation:none}#brandsplash .wm{animation:none;opacity:1}#brandsplash .rg,#brandsplash .gl{display:none}}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PREPFIX">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style id="safety">main.home .tiles{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-auto-rows:auto!important}@media(min-width:620px){main.home .tiles{grid-template-columns:repeat(4,minmax(0,1fr))!important}}body.desk main.home .tiles{grid-template-columns:repeat(6,minmax(0,1fr))!important}.tile{min-width:0}</style>
</head>
<body>
<div id="brandsplash" aria-hidden="true"><div class="alogo sp" role="img" aria-label="PREPFIX — Prepare. Perfect. Present."><span class="gl"></span><span class="rg r1"></span><span class="rg r2"></span><div class="pmw"><img class="pm" src="/brand/prepfix-logo-600.png" alt=""></div><img class="wm" src="/brand/prepfix-logo-600.png" alt=""><img class="w w1" src="/brand/prepfix-logo-600.png" alt=""><img class="w w2" src="/brand/prepfix-logo-600.png" alt=""><img class="w w3" src="/brand/prepfix-logo-600.png" alt=""></div><i></i><small>CREATED BY CYRUS IRERI · 0720872582</small></div>
<div id="app">
  <div class="splash">
    <div class="splash-logo"></div>
    <p>Loading timetables…</p>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/config.js"></script>
<script src="/app.js" defer></script>
</body>
</html>
